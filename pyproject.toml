[project]
name = "openhealthrouter"
version = "0.1.0"
description = "Local-first health data routing layer for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant>=2026.10",
    "jsonschema>=4.26.0",
    "pyright>=1.1.390",
    "pytest-asyncio>=0.25",
    "pytest-homeassistant-custom-component>=0.13",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["custom_components", "scripts", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
