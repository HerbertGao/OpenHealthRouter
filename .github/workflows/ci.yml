name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff format
        run: uv run ruff format --check

      - name: Ruff lint
        run: uv run ruff check

      - name: Pyright
        run: uv run pyright

      - name: Sensitive data scan
        run: |
          if grep -rEn '1[3-9][0-9]{9}' tests/fixtures/; then
            echo "发现疑似真实手机号，tests/fixtures 只允许合成数据" >&2
            exit 1
          fi

      - name: Contract check
        run: uv run python scripts/check_contracts.py

      - name: Pytest
        run: uv run pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
